[package]
name = "typelesslocal-ui"
version = "1.1.64"
edition = "2021"
rust-version = "1.83"
publish = false

[dependencies]
dioxus = { version = "=0.7.3", default-features = false, features = ["web", "minimal"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
